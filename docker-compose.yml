services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    gpus: all
    volumes:
      - ollama_data:/root/.ollama

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8424:8424"
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
    depends_on:
      - qdrant
      - ollama

  orchestrator:
    build:
      context: ./orchestrator
    restart: unless-stopped
    ports:
      - "8430:8430"
    environment:
      CATALOG_API_URL: ${CATALOG_API_URL:-http://api:8424}
      AI_BASE_URL: ${AI_BASE_URL:-http://ollama:11434}
      AI_MODEL: ${AI_MODEL:-qwen3.5:9b}
      # Use Ollama qwen3.5:9b by default for orchestrator parsing
      # Set AI_BASE_URL=http://ollama:11434 and AI_MODEL=qwen3.5:9b in .env to override
      SPEC_DIR: /app/specs
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MEMORY_TTL_SEC: ${MEMORY_TTL_SEC:-86400}
      MEMORY_MAX_TURNS: ${MEMORY_MAX_TURNS:-8}
      MEMORY_PREFIX: ${MEMORY_PREFIX:-mem}
    depends_on:
      - api
      - redis
    volumes:
      - orchestrator_specs:/app/specs

volumes:
  qdrant_storage:
  ollama_data:
  orchestrator_specs:
